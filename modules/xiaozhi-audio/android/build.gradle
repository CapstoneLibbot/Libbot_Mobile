plugins {
  id 'com.android.library'
  // Registers this module with Expo's runtime registry. Without this plugin
  // the Kotlin classes are packaged but requireOptionalNativeModule returns
  // undefined at runtime.
  id 'expo-module-gradle-plugin'
}

group = 'com.libot.xiaozhiaudio'
version = '0.1.0'

android {
  namespace 'com.libot.xiaozhiaudio'
  compileSdk 36

  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
